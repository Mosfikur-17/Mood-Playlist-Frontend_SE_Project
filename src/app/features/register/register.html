<section class="auth-page">
  <div class="auth-container">
    
    <div class="auth-card glass-card">
      <div class="auth-header">
        <span class="logo-icon">✨</span>
        <h2>Create Account</h2>
        <p>Unlock personalized mood playlists & cognitive flow tools</p>
      </div>

      <div class="error-alert" *ngIf="error">
        ⚠️ {{ error }}
      </div>

      <form (ngSubmit)="submit()">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input id="name" name="name" type="text" [(ngModel)]="name" required placeholder="Alex Rivera" class="form-input">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" [(ngModel)]="email" required placeholder="alex@moodplaylist.dev" class="form-input">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" [(ngModel)]="password" required placeholder="At least 4 characters" class="form-input">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="confirmPassword" required placeholder="Re-enter password" class="form-input">
        </div>

        <button class="btn-primary full-width-btn" type="submit">
          Get Started Free
        </button>
      </form>

      <div class="auth-footer">
        <span>Already have an account?</span>
        <a routerLink="/login">Log In</a>
      </div>
    </div>

  </div>
</section>
