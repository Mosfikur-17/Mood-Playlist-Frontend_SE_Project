<section class="auth-page">
  <div class="auth-container">
    
    <div class="auth-card glass-card">
      <div class="auth-header">
        <span class="logo-icon">🎧</span>
        <h2>Welcome Back</h2>
        <p>Log in to access your saved playlists & mood history</p>
      </div>

      <div class="error-alert" *ngIf="error">
        ⚠️ {{ error }}
      </div>

      <form (ngSubmit)="submit()">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" [(ngModel)]="email" required class="form-input">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" [(ngModel)]="password" required class="form-input">
        </div>

        <button class="btn-primary full-width-btn" type="submit">
          Log In
        </button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <button class="btn-secondary full-width-btn" type="button" (click)="loginAsDemo()">
        ⚡ Quick Login as Demo User
      </button>

      <div class="auth-footer">
        <span>Don't have an account?</span>
        <a routerLink="/register">Sign Up Free</a>
      </div>
    </div>

  </div>
</section>
